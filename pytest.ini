[pytest]
minversion = 8.0
testpaths = tests/unit tests/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = src .
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src/fin_ai
    --cov-report=term-missing
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may exercise Streamlit AppTest or multi-module flows)
    slow: Slow running tests
    requires_network: Tests that require internet access (e.g. downloading the local embedding model, or a live Mistral API call)
